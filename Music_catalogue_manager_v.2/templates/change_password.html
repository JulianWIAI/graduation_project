{% extends "base.html" %}
{% block title %}{{ _('Passwort ändern — SBS Catalog') }}{% endblock %}
{% block content %}
<div style="max-width:480px;margin:2rem auto;">
  <div style="background:#1a1a22;border:1px solid #2e2e3e;border-radius:12px;padding:2rem;">
    <h1 style="font-size:1.3rem;font-weight:600;margin-bottom:1rem;color:#f0f0f0;">
      {{ _('Passwort ändern') }}
    </h1>

    <p style="font-size:.9rem;color:#aaa;margin-bottom:1.5rem;">
      {{ _('Beim nächsten Login muss das Passwort geändert werden.') }}
    </p>

    <form method="post" action="{{ url_for('auth.change_password') }}">
      <label style="display:block;font-size:.8rem;color:#999;margin-bottom:.3rem;">
        {{ _('Neues Passwort') }}
      </label>
      <input type="password" name="new_password" required autocomplete="new-password"
             style="width:100%;padding:.6rem .8rem;background:#13131a;border:1px solid #2e2e3e;
                    border-radius:6px;color:#e2e2e2;font-size:.95rem;margin-bottom:.8rem;">

      <label style="display:block;font-size:.8rem;color:#999;margin-bottom:.3rem;">
        {{ _('Passwort bestätigen') }}
      </label>
      <input type="password" name="confirm" required autocomplete="new-password"
             style="width:100%;padding:.6rem .8rem;background:#13131a;border:1px solid #2e2e3e;
                    border-radius:6px;color:#e2e2e2;font-size:.95rem;">

      <button type="submit" class="btn btn-primary" style="margin-top:1.2rem;">
        {{ _('Passwort ändern') }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
