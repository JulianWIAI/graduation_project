{% extends "base.html" %}
{% block title %}{{ _('Sicherheitsfrage') }} — {{ brand.name }}{% endblock %}
{% block content %}
<div style="max-width:480px;margin:2rem auto;">
  <div style="background:#1a1a22;border:1px solid #2e2e3e;border-radius:12px;padding:2rem;">
    <h1 style="font-size:1.3rem;font-weight:600;margin-bottom:.6rem;color:#f0f0f0;">
      {{ _('Sicherheitsfrage') }}
    </h1>
    <p style="font-size:.85rem;color:#aaa;margin-bottom:.6rem;">
      {{ _('Damit kannst du dein Passwort zurücksetzen, falls du es vergisst.') }}
    </p>

    <form method="post" action="{{ url_for('auth.security_question') }}">
      <label for="current_password" style="display:block;font-size:.8rem;color:#999;margin:.9rem 0 .3rem;">{{ _('Aktuelles Passwort') }}</label>
      <input type="password" id="current_password" name="current_password" required
             autocomplete="current-password" style="width:100%;padding:.6rem .8rem;background:#13131a;border:1px solid #2e2e3e;border-radius:6px;color:#e2e2e2;font-size:.95rem;">

      <label for="security_question" style="display:block;font-size:.8rem;color:#999;margin:.9rem 0 .3rem;">{{ _('Sicherheitsfrage') }}</label>
      <input type="text" id="security_question" name="security_question" required
             value="{{ question or '' }}" placeholder="{{ _('z. B. Name des ersten Haustiers') }}" style="width:100%;padding:.6rem .8rem;background:#13131a;border:1px solid #2e2e3e;border-radius:6px;color:#e2e2e2;font-size:.95rem;">

      <label for="security_answer" style="display:block;font-size:.8rem;color:#999;margin:.9rem 0 .3rem;">{{ _('Antwort') }}</label>
      <input type="text" id="security_answer" name="security_answer" required autocomplete="off"
             style="width:100%;padding:.6rem .8rem;background:#13131a;border:1px solid #2e2e3e;border-radius:6px;color:#e2e2e2;font-size:.95rem;">

      <button type="submit" class="btn btn-primary" style="margin-top:1.2rem;">
        {{ _('Speichern') }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
